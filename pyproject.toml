[project]
name = "screen-copier"
version = "0.1.0"
description = "Copy code from another computer's screen with a webcam and Claude vision."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Win32 (MS Windows)",
    "Private :: Do Not Upload",
]
dependencies = [
    "PySide6>=6.8,<7",
    "opencv-python>=4.10,<5",
    "numpy>=2",
    "anthropic>=0.70",
    "pydantic>=2.7,<3",
    "keyring>=25",
    "platformdirs>=4",
    "PyYAML>=6",
]

[project.gui-scripts]
screen-copier = "screen_copier.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screen_copier"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/*.md contain illustrative code sketches, not formatted source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = ["--import-mode=importlib"]
